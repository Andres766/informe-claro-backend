// Microservicio de interpretación: explica cada valor en lenguaje sencillo (IA por REST —Gemini o
// Claude— o motor por reglas), aplica los guardrails clínicos y sugiere preguntas para el médico.
syntax = "proto3";

package informeclaro.interpretacion;

import "comun.proto";

option java_multiple_files = true;
option java_package = "co.edu.ucc.informeclaro.grpc.interpretacion";

service InterpretacionServicio {
  rpc Interpretar (InterpretarRequest) returns (InterpretacionReply);
  rpc ObtenerAviso (AvisoRequest) returns (AvisoReply);
  rpc Estado (informeclaro.comun.Vacio) returns (EstadoReply);
  // Uso de cada motor, tiempos y fallos recientes de la IA, para el panel de administración.
  rpc Estadisticas (informeclaro.comun.Vacio) returns (EstadisticasInterpretacionReply);
}

message InterpretarRequest {
  string texto = 1;   // texto ya anonimizado
  string idioma = 2;  // "es" o "en"
}

message ValorInterpretado {
  string nombre_valor = 1;
  string valor = 2;
  string unidad = 3;
  string rango_referencia = 4;
  string estado = 5;
  string explicacion = 6;
}

message InterpretacionReply {
  string resumen = 1;
  repeated ValorInterpretado valores = 2;
  repeated string preguntas = 3;
  string motor = 4;
}

message AvisoRequest {
  string idioma = 1;
}

message AvisoReply {
  string aviso = 1;
}

message EstadoReply {
  string motor = 1;
}

message UsoMotor {
  string motor = 1;
  int32 interpretaciones = 2;
  int64 duracion_promedio_ms = 3;
}

message FalloIa {
  string fecha = 1;  // ISO-8601 en UTC
  string causa = 2;
}

message EstadisticasInterpretacionReply {
  int32 total = 1;
  int64 duracion_promedio_ms = 2;
  int32 guardrails_activados = 3;
  int32 respaldo = 4;  // veces que la IA falló y respondió el motor por reglas
  repeated UsoMotor motores = 5;
  repeated FalloIa fallos_recientes = 6;
}
