# Microservicio de interpretación: sin servidor web, solo gRPC (HTTP/2).
# Sale hacia el microservicio de documentos por gRPC y hacia la API de Anthropic por REST.
spring:
  application:
    name: servicio-interpretacion
  main:
    web-application-type: none
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

grpc:
  servidor:
    puerto: ${PUERTO_GRPC_INTERPRETACION:9093}

informeclaro:
  servicios:
    documentos: ${DESTINO_DOCUMENTOS:127.0.0.1:9092}   # gRPC
  anthropic:                                           # REST (API de terceros)
    url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    api-key: ${ANTHROPIC_API_KEY:}
    modelo: ${LLM_MODEL:claude-opus-5}
  base-datos:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5435/informeclaro}
    usuario: ${DB_USUARIO:informeclaro}
    clave: ${DB_CLAVE:informeclaro}
    pool: ${DB_POOL:2}
