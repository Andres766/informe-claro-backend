# Microservicio de usuarios: sin servidor web, solo gRPC (HTTP/2).
spring:
  application:
    name: servicio-usuarios
  main:
    web-application-type: none
  jpa:
    hibernate:
      ddl-auto: update        # crea/actualiza solo las tablas de este servicio
    properties:
      hibernate.jdbc.time_zone: UTC

grpc:
  servidor:
    puerto: ${PUERTO_GRPC_USUARIOS:9091}

informeclaro:
  base-datos:                 # base de datos ÚNICA compartida por los microservicios
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5435/informeclaro}
    usuario: ${DB_USUARIO:informeclaro}
    clave: ${DB_CLAVE:informeclaro}
    pool: ${DB_POOL:3}
  jwt:
    secreto: ${JWT_SECRET:}
    horas: ${JWT_HORAS:8}
